<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hiểu đúng bảo hiểm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/page-flip.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app" id="app" data-state="closed">

    <!-- Điều khiển tối thiểu, góc trên -->
    <div class="topbar">
      <button class="icon-btn" id="btnSound" type="button" aria-pressed="true" aria-label="Tắt âm thanh lật trang" title="Âm thanh">
        <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9.5l5 5M22 9.5l-5 5"/></svg>
      </button>
      <button class="icon-btn" id="btnClose" type="button" aria-label="Đóng sách" title="Đóng sách" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <!-- Cuốn sách -->
    <div class="viewport" id="viewport">
      <div class="stage" id="stage">
        <div class="book-shadow" id="bookShadow" aria-hidden="true"></div>
        <div class="edge edge--left" id="edgeLeft" aria-hidden="true"></div>
        <div class="edge edge--right" id="edgeRight" aria-hidden="true"></div>
        <div class="book" id="book" tabindex="0" role="region"
             aria-roledescription="sách" aria-label="Sách Hiểu đúng bảo hiểm. Nhấn Enter để mở, phím mũi tên để lật trang."></div>
      </div>
    </div>

    <!-- Hướng dẫn nhỏ -->
    <p class="hint" id="hint" aria-hidden="true">Chạm vào bìa để mở sách</p>

    <!-- Điều hướng trang, góc dưới -->
    <nav class="pager" id="pager" aria-label="Điều hướng trang" hidden>
      <button class="icon-btn" id="btnPrev" type="button" aria-label="Trang trước" title="Trang trước (←)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="pager-label" id="pageLabel">Trang 1 / 10</span>
      <button class="icon-btn" id="btnNext" type="button" aria-label="Trang sau" title="Trang sau (→)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </nav>

    <div class="sr-only" aria-live="polite" id="live"></div>
  </main>

  <!-- Chế độ phóng lớn -->
  <div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Xem phóng lớn trang" hidden>
    <div class="zoom-viewport" id="zoomViewport">
      <div class="zoom-page" id="zoomPage"></div>
    </div>
    <div class="zoom-bar">
      <button class="icon-btn" id="zoomOut" type="button" aria-label="Thu nhỏ" title="Thu nhỏ (−)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button class="zoom-level" id="zoomLevel" type="button" title="Vừa màn hình (0)">100%</button>
      <button class="icon-btn" id="zoomIn" type="button" aria-label="Phóng to" title="Phóng to (+)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <span class="zoom-sep" aria-hidden="true"></span>
      <button class="icon-btn" id="zoomClose" type="button" aria-label="Đóng chế độ phóng lớn" title="Đóng (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>

  <!-- Thứ tự tải: thư viện lật trang → nội dung sách → âm thanh → ứng dụng -->
  <script src="vendor/page-flip.browser.js"></script>
  <script src="content/book-content.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
